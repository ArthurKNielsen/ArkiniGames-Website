<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arkini Games — low-poly games from Aarhus</title>
<meta name="description" content="Arkini Games is a one-person indie studio in Aarhus, Denmark. Now loading: KRAVN, a fast, gory boomer shooter where your only weapon is a stick that always comes back. Wishlist it on Steam.">
<meta name="theme-color" content="#0b0807">
<meta name="color-scheme" content="dark">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Arkini Games">
<meta property="og:title" content="Arkini Games — KRAVN, coming to Steam">
<meta property="og:description" content="One stick. Six sectors. A lot of blood. A boomer shooter made by one person in Aarhus, Denmark. Wishlist KRAVN on Steam.">
<meta property="og:url" content="https://arkinigames.com/">
<meta property="og:image" content="https://arkinigames.com/assets/og/og-image-1200x630.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Arkini Games logo next to a dithered red corridor from KRAVN">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Arkini Games — KRAVN, coming to Steam">
<meta name="twitter:description" content="One stick. Six sectors. A lot of blood. Wishlist KRAVN on Steam.">
<meta name="twitter:image" content="https://arkinigames.com/assets/og/og-image-1200x630.png">

<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
<link rel="preload" href="assets/fonts/silkscreen-400-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/vt323-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css?v=13">

<script>
  (function () {
    var d = document.documentElement, booted = false, crt = true;
    try { booted = sessionStorage.getItem("arkini.booted") === "1"; } catch (e) {}
    try { crt = localStorage.getItem("arkini.crt") !== "0"; } catch (e) {}
    if (booted || matchMedia("(prefers-reduced-motion: reduce)").matches) d.classList.add("no-boot");
    if (!crt) d.classList.add("crt-off");
    d.classList.add("js");
  })();
</script>
</head>
<body>

<a class="skip" href="#screen">Skip to content</a>

<div id="boot" class="boot" aria-hidden="true">
  <canvas class="boot__logo" width="200" height="72"></canvas>
  <div class="boot__lines"></div>
  <p class="boot__skip">PRESS ANY BUTTON</p>
</div>

<div class="console">
  <header class="bar bar--top">
    <a class="bar__home" href="#/">ARKINI<span>SYS</span></a>
    <nav class="bar__nav" id="mainnav" aria-label="Main"></nav>
    <div class="bar__toggles">
      <button class="bar__btn" id="mus" type="button" aria-pressed="true">MUS <b>ON</b></button>
      <button class="bar__btn" id="snd" type="button" aria-pressed="true">SND <b>ON</b></button>
    </div>
  </header>

  <main id="screen" class="screen" tabindex="-1">
    <noscript>
      <section class="noscript">
        <h1>Arkini Games</h1>
        <p>One-person studio in Aarhus, Denmark. The console needs JavaScript to boot, but here are the goods:</p>
        <ul>
          <li><a href="https://store.steampowered.com/app/5088220/KRAVN/">KRAVN on Steam</a>: a fast, gory boomer shooter. One stick, six sectors.</li>
          <li><a href="https://www.youtube.com/@arkinigames">YouTube @arkinigames</a></li>
        </ul>
      </section>
    </noscript>
  </main>

  <footer class="bar bar--bottom" aria-hidden="true">
    <span class="hint"><i class="pad pad--x"></i>SELECT</span>
    <span class="hint"><i class="pad pad--tri"></i>BACK</span>
    <span class="bar__region">PAL · AARHUS DK · BUILD 13</span>
  </footer>
</div>

<div id="loader" class="loader" aria-hidden="true">
  <canvas class="loader__disc" width="96" height="96"></canvas>
  <p class="loader__txt">NOW LOADING<span class="dots"></span></p>
</div>

<dialog id="lightbox" class="lightbox" aria-label="Screenshot viewer">
  <figure class="lightbox__fig">
    <img class="lightbox__img" alt="">
    <figcaption class="lightbox__cap"></figcaption>
  </figure>
  <button class="lightbox__btn lightbox__prev" type="button" aria-label="Previous screenshot">&lt;</button>
  <button class="lightbox__btn lightbox__next" type="button" aria-label="Next screenshot">&gt;</button>
  <button class="lightbox__close" type="button" aria-label="Close viewer">CLOSE <i class="pad pad--tri"></i></button>
</dialog>

<div class="crt" aria-hidden="true"><div class="crt__roll"></div></div>

<script src="js/games.js?v=13"></script>
<script src="js/fx.js?v=13"></script>
<script src="js/sound.js?v=13"></script>
<script src="js/descent.js?v=13"></script>
<script src="js/app.js?v=13"></script>
</body>
</html>
